<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>牧神的地窖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1f17;--paper:#e9dcc2;--paper2:#dccba9;--line:#8a7253;--dark:#14100c;--gold:#b8894a;--rust:#8b3a1a;--light:#d9c8a8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--dark);color:var(--ink);font-family:'Noto Serif TC','Noto Serif JP','Noto Serif KR',Georgia,serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .8s}
.screen.on{display:flex}.screen.show{opacity:1}

/* 開場 */
#intro{flex-direction:column;gap:28px;color:var(--light);text-align:center;padding:24px}
#intro p{font-size:20px;letter-spacing:.2em;line-height:2}
.ghost{background:none;border:1px solid #6d5a42;color:var(--light);padding:10px 28px;font-size:15px;letter-spacing:.3em}
.ghost:hover{background:#2a2118}

/* 登記簿 */
#creator{overflow-y:auto;align-items:flex-start;padding:16px 0 40px}
.book{width:min(920px,94vw);margin:auto;background:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,rgba(138,114,83,.18) 31px 32px);
  border:2px solid var(--line);box-shadow:0 0 0 6px var(--paper2),0 0 0 8px var(--line),0 20px 50px rgba(0,0,0,.6);padding:22px 22px 26px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.book h1{grid-column:1/-1;text-align:center;font-size:20px;letter-spacing:.35em;color:var(--rust);border-bottom:1px solid var(--line);padding-bottom:10px}
.book h1 small{display:block;font-size:11px;letter-spacing:.25em;color:#7a6550;margin-top:4px}
.portrait-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.frame{width:100%;max-width:400px;aspect-ratio:1;border:3px solid var(--ink);outline:1px solid var(--line);outline-offset:4px;background:#a7a4a2;position:relative}
.frame canvas{width:100%;height:100%;display:block}
.stamp{position:absolute;right:-8px;bottom:-10px;width:70px;height:70px;border:2px solid rgba(139,58,26,.75);border-radius:50%;color:rgba(139,58,26,.8);font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;letter-spacing:.1em;opacity:0;transform:rotate(-14deg) scale(1.8);transition:opacity .25s,transform .25s}
.stamp.on{opacity:1;transform:rotate(-14deg) scale(1)}
.nameline{width:100%;max-width:400px;display:flex;align-items:baseline;gap:10px;font-size:15px}
.nameline input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--ink);font-family:inherit;font-size:18px;color:var(--ink);padding:4px 2px;outline:none}
.fields{display:flex;flex-direction:column;gap:18px}
.field label{display:block;font-size:13px;letter-spacing:.2em;color:#6a5440;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:rgba(255,255,255,.25);padding:7px 14px;font-size:14px;color:var(--ink)}
.opt.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.thumbs .opt{padding:3px;width:62px;height:62px}.thumbs canvas{width:100%;height:100%;display:block}
.sw{width:30px;height:30px;border:2px solid var(--paper);outline:1px solid var(--line);padding:0}
.sw.sel{outline:2px solid var(--ink);outline-offset:1px}
.colorpick{width:30px;height:30px;border:1px dashed var(--line);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden}
.colorpick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.confirm{margin-top:8px;align-self:flex-start;background:var(--rust);color:var(--paper);border:none;padding:12px 30px;font-size:15px;letter-spacing:.35em}
.confirm:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:#7a6550;min-height:1em}
@media (max-width:720px){.book{grid-template-columns:1fr;gap:18px;padding:16px}.frame,.nameline{max-width:none}}

/* 地窖 */
#game{flex-direction:column;justify-content:flex-start;padding:max(8px,env(safe-area-inset-top)) 0 8px}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;height:100%}
.view{position:relative;width:min(100vw,calc(100vh - 210px),720px);aspect-ratio:1;background:#000;overflow:hidden;flex-shrink:0;border:3px solid #000;outline:1px solid #3a2c1f}
.view img.wall{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;transition:opacity .35s}
.hot{position:absolute;background:transparent;border:none;padding:0}
.debug .hot{background:rgba(255,0,0,.22);outline:1px solid red}
.arrow{position:absolute;background:rgba(20,14,10,.35);border:none;color:#e8d8b8;font-size:22px;width:38px;height:64px;display:flex;align-items:center;justify-content:center;opacity:.75;z-index:5}
.arrow:hover{opacity:1}
.arrow.l{left:0;top:50%;transform:translateY(-50%)}.arrow.r{right:0;top:50%;transform:translateY(-50%)}
.arrow.u{top:0;left:50%;transform:translateX(-50%);width:64px;height:34px}.arrow.d{bottom:0;left:50%;transform:translateX(-50%);width:64px;height:34px}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:8}
.dim.on{opacity:.92}
.side{display:contents}
.inv{display:flex;gap:6px;justify-content:center}
.slot{width:52px;height:52px;background:#2a1f16;border:3px solid #0d0906;outline:1px solid #5c4630;position:relative;padding:3px;box-shadow:inset 0 0 10px rgba(0,0,0,.8)}
.slot img,.slot canvas{width:100%;height:100%;object-fit:contain;display:block}
.slot.sel{outline:2px solid #e2b86a;outline-offset:1px}
.msg{width:min(100vw,720px);min-height:58px;padding:10px 16px;color:var(--light);font-size:15px;line-height:1.7;text-align:center;letter-spacing:.05em}
.msg .pan{color:#e2b86a}
@media (min-width:900px) and (min-aspect-ratio:4/3){
  .stage{flex-direction:row;justify-content:center;align-items:center;gap:18px}
  .view{width:min(calc(100vh - 40px),720px)}
  .side{display:flex;flex-direction:column;gap:14px;width:260px}
  .inv{flex-direction:column;align-items:center}
  .slot{width:64px;height:64px}
  .msg{width:260px;text-align:left}
}

/* 視窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.card{background:var(--paper);border:2px solid var(--line);box-shadow:0 0 0 5px var(--paper2),0 0 0 7px var(--line);padding:18px;max-width:520px;width:100%;text-align:center;position:relative;max-height:94vh;overflow-y:auto}
.card img,.card canvas{max-width:100%;display:block;margin:0 auto}
.card .note{font-size:16px;color:var(--ink);margin-top:14px;letter-spacing:.1em}
.card .sub{font-size:13px;color:#6a5440;margin-top:8px;line-height:1.7}
.card .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.card button.act{background:var(--ink);color:var(--paper);border:none;padding:9px 22px;font-size:14px;letter-spacing:.2em}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-160%);background:#2a1f16;color:#e2b86a;border:1px solid #5c4630;padding:8px 18px;font-size:14px;letter-spacing:.12em;z-index:60;transition:transform .4s}
.toast{visibility:hidden}.toast.on{transform:translateX(-50%) translateY(0);visibility:visible}
html[lang=en] body *,html[lang=es] body *{letter-spacing:.02em!important}

#muteBtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:70;width:38px;height:38px;border-radius:50%;background:rgba(20,14,10,.6);border:1px solid #5c4630;color:#e2b86a;font-size:17px;display:none}
#muteBtn.on{display:block}#muteBtn.off{color:#6d5a42;text-decoration:line-through}
.lock{display:flex;gap:10px;justify-content:center;margin-top:16px}
.wheel{display:flex;flex-direction:column;align-items:center;background:#3a2b1c;border:2px solid #1a120c;outline:1px solid #b8894a;padding:4px 2px;width:50px}
.wheel button{background:none;border:none;color:#e2b86a;font-size:18px;width:100%;padding:4px 0}
.wheel span{font-size:28px;color:#f0dcae;font-family:Georgia,serif;line-height:1.3}
.sfx{position:absolute;left:50%;top:14%;z-index:9;font-size:clamp(30px,8vw,52px);font-weight:700;color:#f3e2b5;letter-spacing:.06em;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 12px rgba(255,200,120,.55),3px 3px 0 #1a120c;transform:translate(-50%,0) rotate(-6deg) scale(.2);opacity:0}
.sfx.go{animation:sfxpop 1.6s ease-out forwards}
@keyframes sfxpop{0%{opacity:0;transform:translate(-50%,0) rotate(-6deg) scale(.2)}18%{opacity:1;transform:translate(-50%,0) rotate(-6deg) scale(1.15)}30%{transform:translate(-50%,0) rotate(-4deg) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px) rotate(-4deg) scale(1)}}
/* 結局 */
#ending{flex-direction:column;color:var(--light);text-align:center;padding:24px;gap:18px;overflow-y:auto}
#ending h2{font-size:22px;letter-spacing:.3em;color:#e2b86a}
#ending p{font-size:16px;line-height:2;max-width:520px}
#ending ul{list-style:none;font-size:14px;line-height:2;opacity:.9}
#ending li.no{opacity:.35}
#ending{justify-content:flex-start;padding-top:28px}
#endImg{width:min(88vw,460px);aspect-ratio:1;object-fit:cover;border:3px solid #000;outline:1px solid #5c4630;opacity:0;transition:opacity 2s .6s;flex-shrink:0}
#endImg.on{opacity:1}
</style>
</head>
<body>

<section id="intro" class="screen">
  <p data-t="他記得你的樣子嗎？">他記得你的樣子嗎？</p>
  <div id="langs" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"></div>
  <button class="ghost" id="startBtn" data-t="翻開登記簿">翻開登記簿</button>
  <small id="ver" style="position:fixed;bottom:8px;right:10px;opacity:.35;font-size:11px;letter-spacing:.1em">v1.4 · 1117</small>
</section>

<section id="creator" class="screen">
  <div class="book">
    <h1><span data-t="無名小鎮　外來者登記簿">無名小鎮　外來者登記簿</span><small>UMBRIA · REGISTRO DEGLI STRANIERI</small></h1>
    <div class="portrait-wrap">
      <div class="frame"><canvas id="portrait" width="640" height="640"></canvas><div class="stamp" data-t="已<br>登記">已<br>登記</div></div>
      <div class="nameline"><span data-t="姓名">姓名</span><input id="nameInput" maxlength="12" placeholder="請填寫" data-tp="請填寫" autocomplete="off"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="fields">
      <div class="field"><label data-t="眼型">眼型</label><div class="opts" id="optEye"></div></div>
      <div class="field"><label data-t="瞳孔">瞳孔</label><div class="opts" id="optPupil"></div></div>
      <div class="field"><label data-t="瞳色">瞳色</label><div class="opts" id="optEyeColor"></div></div>
      <div class="field"><label data-t="髮型">髮型</label><div class="opts thumbs" id="optHair"></div></div>
      <div class="field"><label data-t="髮色">髮色</label><div class="opts" id="optHairColor"></div></div>
      <button class="confirm" id="confirmBtn" data-t="簽名" disabled>簽名</button>
    </div>
  </div>
</section>

<section id="game" class="screen">
  <div class="stage">
    <div class="view" id="view">
      <img class="wall" id="wallImg" alt="">
      <div id="hots"></div>
      <button class="arrow l" id="navL">‹</button>
      <button class="arrow r" id="navR">›</button>
      <button class="arrow u" id="navU">︿</button>
      <button class="arrow d" id="navD">﹀</button>
      <div class="dim" id="dim"></div>
    </div>
    <div class="side">
      <div class="inv" id="inv"></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</section>

<section id="ending" class="screen">
  <img id="endImg" alt="">
  <h2 id="endTitle"></h2>
  <p id="endText"></p>
  <ul id="achList"></ul>
  <div id="codeBox"></div>
  <div id="cardLink" style="margin-top:6px;max-width:420px"><div data-t="他還在翁布里亞。" style="font-size:13px;opacity:.7;margin-bottom:10px">他還在翁布里亞。</div><a href="https://caveduck.io/zh-hant/share/characters/679d53b2-b726-446b-afae-b118a07e808c?rc=ku1A1yGuNy" target="_blank" rel="noopener" data-t="回到牧神的畫室：敘舊，或開啟新的篇章" style="display:inline-block;border:1px solid #b8894a;color:#e2b86a;text-decoration:none;padding:11px 20px;font-size:14px;letter-spacing:.12em;background:#1e1711;line-height:1.6">回到牧神的畫室：敘舊，或開啟新的篇章</a></div>
  <button class="ghost" id="nightBtn" data-t="那天晚上" style="display:none">那天晚上</button>
  <button class="ghost" id="againBtn" data-t="再進一次地窖">再進一次地窖</button>
</section>

<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>
<audio id="bgm" src="assets/audio/cellar.mp3" loop preload="auto"></audio>
<audio id="endbgm" preload="auto"></audio>
<button id="muteBtn" aria-label="靜音">♪</button>

<script>
/* ============ 多語系 ============ */
const LANGS=[['zh','中文'],['ja','日本語'],['ko','한국어'],['en','English'],['es','Español']];
const LANG=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q&&LANGS.some(l=>l[0]===q)){try{localStorage.setItem('pan_lang',q)}catch(e){}return q}
  try{const s=localStorage.getItem('pan_lang');if(s)return s}catch(e){}

잎이 손만 대도 부서진다.<br>묶은 끈의 매듭이 무척 반듯하다.", "他每次下來，都把東西放在這張桌上。<br>書、一塊布、一碗還溫著的菜。": "그는 내려올 때마다 이 탁자에 물건을 둔다.<br>책, 천 한 장, 아직 따뜻한 요리.", "一千一百一十七。<br>十一月十七日。今天多了一道菜，不是沒有原因的。": "1117.<br>11월 17일. 오늘 요리가 하나 더 있는 데는 이유가 있다.", "蓋子掀開，是一道你沒吃過的菜，還冒著熱氣。<br>今天比平常多了一道。": "뚜껑을 열자 처음 보는 요리가 김을 내고 있었다.<br>오늘은 평소보다 한 접시 더 많다.", "罐子裡的畫筆都洗乾淨了，筆毛綁著，不給拿。<br>筆毛軟軟的，帶著油光。": "항아리 속 붓은 깨끗이 씻겨 묶여 있어 뺄 수 없다.<br>붓털은 부드럽고 기름기로 반짝인다.", "紅白條紋的蠟燭，像插在生日蛋糕上的那種。<br>燭芯是新的，從來沒點過。": "빨간 줄무늬 초. 생일 케이크에 꽂는 그런 초다.<br>심지는 새것이고, 한 번도 불을 붙인 적 없다.", "筆毛硬得像一截木頭，尖端沾著乾掉的赭色。<br>得泡在油裡，才會軟回來。": "붓털이 나뭇조각처럼 딱딱하고 끝에 마른 황토색이 묻어 있다.<br>기름에 담가야 다시 부드러워진다.", "鑰匙插不進去。這道鎖比鑰匙老得多。<br>柵欄後面的黑暗裡，好像還有房間。": "열쇠가 들어가지 않는다. 이 자물쇠는 열쇠보다 훨씬 오래됐다.<br>철창 너머 어둠 속에 방이 더 있는 것 같다.", "轉輪「喀」一聲對齊了。<br>一千一百一十七。抽屜裡只有一把生鏽的小鑰匙。": "다이얼이 딸깍 맞물렸다.<br>1117. 서랍 안에는 녹슨 작은 열쇠 하나뿐이다.", "你把筆浸進陶罐。<br>是亞麻仁油。乾掉的赭色慢慢化開，跟他身上的味道一樣。": "붓을 항아리에 담근다.<br>아마인유다. 마른 황토색이 천천히 풀린다. 그에게서 나는 냄새와 같다.", "燈裡的油太燙了，筆毛一碰就會燒焦。<br>你聞到另一股油味，從南牆的桌上傳過來。": "등잔 기름은 너무 뜨거워 붓털이 타 버린다.<br>남쪽 벽 책상에서 다른 기름 냄새가 난다.", "截圖或抄下這組碼，連同你在登記簿上簽的名字一起回報。<br>名字要一字不差，碼才對得上。": "이 코드를 캡처하거나 적어서, 명부에 서명한 이름과 함께 보내 주세요.<br>이름이 한 글자라도 다르면 맞지 않습니다.", "<br><br>他的目光停在石桌上那截蠟燭。<br>他沒有說今天是什麼日子。<br>他不知道你知道。": "<br><br>그의 시선이 돌탁자 위 초에 머문다.<br>그는 오늘이 무슨 날인지 말하지 않았다.<br>당신이 안다는 걸 그는 모른다.", "鑰匙轉得很順，像常常有人開。<br>皮箱裡放著一支畫筆，筆毛乾成一束。<br>畫家的筆乾掉了，要泡油才救得回來。": "열쇠가 매끄럽게 돌았다. 자주 열어 본 듯하다.<br>안에는 붓 한 자루, 붓털이 굳어 있다.<br>화가의 붓은 기름에 담가야 되살아난다.", "酒瓶上積著灰，標籤是手寫的義大利文，年份那欄都空著。<br>只有一瓶擦得特別乾淨，標籤上寫著：<b style=\"color:#e2b86a\">XI</b>": "술병에는 먼지가 쌓였고, 손글씨 이탈리아어 라벨의 연도 칸은 비어 있다.<br>한 병만 유난히 깨끗하고, 라벨에 적힌 건: <b style=\"color:#e2b86a\">XI</b>", "醃漬罐排得很整齊，每一罐都寫了日期，沒有年份。<br>最新的那罐寫著：<b style=\"color:#e2b86a\">17</b>，旁邊畫了一顆小小的橄欖。": "절임 병이 가지런하고, 병마다 날짜만 있고 해는 없다.<br>가장 새 병에는: <b style=\"color:#e2b86a\">17</b>. 옆에 작은 올리브 그림.", "外面是傍晚。<br>他坐在畫室裡，沒有回頭。<br>桌上攤著你畫的那張，旁邊多了一行字。<br><br><span style=\"color:#e2b86a\">「你想要什麼。」</span>": "밖은 해 질 녘이었다.<br>그는 작업실에 앉아 돌아보지 않았다.<br>책상에는 당신의 그림이 펼쳐져 있고, 옆에 한 줄이 적혀 있었다.<br><br><span style=\"color:#e2b86a\">「너는 무엇을 원해.」</span>", "外面是傍晚。<br>他坐在畫室裡，沒有回頭。<br>桌上攤著你畫的那張，旁邊多了一行字，和一截燒完的蠟燭。<br>他把它帶上來了。<br><br><span style=\"color:#e2b86a\">「你想要什麼。」</span>": "밖은 해 질 녘이었다.<br>그는 작업실에 앉아 돌아보지 않았다.<br>책상에는 당신의 그림과 한 줄의 글, 그리고 다 타 버린 초가 놓여 있었다.<br>그가 가지고 올라온 것이다.<br><br><span style=\"color:#e2b86a\">「너는 무엇을 원해.」</span>", "你坐回床邊。<br>過了很久，梯子上傳來腳步聲。<br>他停在梯子一半，看著你，又抬頭看了一眼開著的艙口。<br><br><span style=\"color:#e2b86a\">「你想要什麼。」</span><br><br>這是他第一次真的在問。": "당신은 침대 가에 다시 앉았다.<br>한참 뒤, 사다리에서 발소리가 났다.<br>그는 사다리 중간에 멈춰 당신을 보고, 열린 천장 문을 올려다보았다.<br><br><span style=\"color:#e2b86a\">「너는 무엇을 원해.」</span><br><br>그가 진심으로 물은 건 이번이 처음이었다.", "他記得你的樣子嗎？": "그는 당신의 얼굴을 기억할까?", "翻開登記簿": "명부를 펼친다", "無名小鎮　外來者登記簿": "이름 없는 마을　이방인 명부", "姓名": "이름", "請填寫": "적어 주세요", "眼型": "눈매", "瞳孔": "동공", "瞳色": "눈동자 색", "髮型": "머리 모양", "髮色": "머리 색", "簽名": "서명", "已<br>登記": "등록<br>완료", "再進一次地窖": "다시 지하실로", "那天晚上": "그날 밤", "他還在翁布里亞。": "그는 아직 움브리아에 있다.", "回到牧神的畫室：敘舊，或開啟新的篇章": "목신의 화실로: 옛이야기를, 혹은 새로운 장을"}, "en": {"「": "“", "。": ".", "」": "”", "喀": "CLICK", "/喀噠\\": "/CLACK\\", "馬尾": "Ponytail", "柔和": "Soft", "捲髮": "Curly", "橫瞳": "Horizontal", "放開": "Let go", "闔上": "Close", "銳利": "Sharp", "長髮": "Long", "放下": "Put down", "豎瞳": "Vertical", "圓瞳": "Round", "短髮": "Short", "往上走": "Climb up", "小蠟燭": "Small candle", "翻回去": "Turn it back", "走出去": "Leave", "留下來": "Stay", "你的畫": "Your drawing", "拿著：": "Holding: ", "拉抽屜": "Pull the drawer", "自訂顏色": "Custom color", "生日快樂": "Happy Birthday", "白費力氣": "Wasted Effort", "你等著。": "You wait.", "留在這裡": "Stay here", "成就解鎖：": "Achievement unlocked: ", "第一張人像": "The First Portrait", "受潮的畫紙": "Damp paper", "點著的蠟燭": "Lit candle", "艙口開著。": "The hatch is open.", "乾硬的畫筆": "Stiff brush", "烘乾的畫紙": "Dried paper", "泡軟的畫筆": "Softened brush", "終於畫完了。": "Finally finished.", "生鏽的小鑰匙": "Rusty little key", "同一種眼睛。": "The same eyes.", "他沒有下來。": "He didn't come down.", "抽屜紋風不動。": "The drawer doesn't budge.", "架上的木盒空了。": "The box on the shelf is empty.", "這兩樣湊不到一起。": "These two don't go together.", "油燈的油少了一截。": "The lamp oil burns lower.", "夜裡你看得比我 en it.<br>He needs a reason to come down.", "還有 {n} 個成就沒找到。全部找齊，結局會出現通關碼。": "{n} achievement(s) still missing. Find them all and the ending will show a pass code.", "光從上面落下來，梯子已經放好了。<br>沒有人在上面等你。": "Light pours down. The ladder is already in place.<br>No one is waiting above.", "他不知道蠟燭是要許願的。<br>他只是守著，直到它自己燒完。": "He didn't know a candle is for making a wish.<br>He just watched over it until it burned out.", "鎖是四位數。<br>這地窖裡，有人在酒瓶和醃漬罐上寫過數字。": "The lock takes four digits.<br>Someone wrote numbers on the wine bottles and the jars.", "你把紙舉到油燈上方。<br>水氣一點一點散掉，紙邊捲了起來。": "You hold the paper over the lamp.<br>The damp lifts bit by bit; the edges curl.", "油燈不能熄。<br>你試過了，火苗連晃都沒晃。燈罩燙得不能碰。": "The lamp won't go out.<br>You tried; the flame didn't even flicker. The glass is too hot to touch.", "你踮腳去搆架上的小木盒。<br>盒子歪了一下，有東西掉了出來。": "You stand on your toes for the little box.<br>It tips, and something falls out.", "這些筆是泡過油才變軟的。<br>桌上那個陶罐，聞起來是亞麻仁油。": "These brushes were softened in oil.<br>The clay jug on the desk smells of linseed oil.", "床頭的書都是你會挑的那種。<br>你沒告訴過任何人你喜歡讀什麼。": "The books by the bed are exactly the kind you'd choose.<br>You never told anyone what you like to read.", "你攤開紙。筆毛上的赭色化開了，剛好夠畫一個人。<br>你畫了他。": "You spread the paper. The loosened ochre is just enough for one person.<br>You draw him.", "鑰匙在這個鎖孔裡顯得太小了。<br>門很厚，聽不見外面任何聲音。": "The key is far too small for this lock.<br>The door is thick; you hear nothing outside.", "籃子裡捲著幾張畫紙。你抽了一張，摸起來冰冰的。<br>地窖太潮了。": "Rolled sheets of paper in the basket. You pull one out; it's cold.<br>The cellar is too damp.", "你把蠟燭立在菜旁邊。<br>沒有人唱歌。地窖很安靜，只有火苗的聲音。": "You stand the candle beside the dish.<br>No one sings. The cellar is quiet but for the flame.", "乾燥的洋甘菊，花瓣一碰就碎。<br>綁花的繩子上打了一個很工整的結。": "Dried chamomile, petals crumbling at a touch.<br>The string is tied in a very neat knot.", "他每次下來，都把東西放在這張桌上。<br>書、一塊布、一碗還溫著的菜。": "Every time he comes down, he leaves things on this table.<br>A book, a cloth, a dish still warm.", "一千一百一十七。<br>十一月十七日。今天多了一道菜，不是沒有 從南牆的桌上傳過來。": "El aceite de la lámpara quema; chamuscaría las cerdas.<br>Hueles otro aceite, desde el escritorio de la pared sur.", "截圖或抄下這組碼，連同你在登記簿上簽的名字一起回報。<br>名字要一字不差，碼才對得上。": "Haz captura o copia este código y envíalo con el nombre que firmaste.<br>El nombre debe coincidir exactamente.", "<br><br>他的目光停在石桌上那截蠟燭。<br>他沒有說今天是什麼日子。<br>他不知道你知道。": "<br><br>Su mirada se detiene en la vela de la mesa de piedra.<br>No dice qué día es.<br>No sabe que tú lo sabes.", "鑰匙轉得很順，像常常有人開。<br>皮箱裡放著一支畫筆，筆毛乾成一束。<br>畫家的筆乾掉了，要泡油才救得回來。": "La llave gira suave, como si se usara a menudo.<br>Dentro, un pincel con las cerdas endurecidas.<br>El pincel de un pintor necesita aceite para revivir.", "酒瓶上積著灰，標籤是手寫的義大利文，年份那欄都空著。<br>只有一瓶擦得特別乾淨，標籤上寫著：<b style=\"color:#e2b86a\">XI</b>": "Botellas polvorientas con etiquetas en italiano, el año siempre en blanco.<br>Solo una está limpia. Su etiqueta dice: <b style=\"color:#e2b86a\">XI</b>", "醃漬罐排得很整齊，每一罐都寫了日期，沒有年份。<br>最新的那罐寫著：<b style=\"color:#e2b86a\">17</b>，旁邊畫了一顆小小的橄欖。": "Los frascos en filas ordenadas, cada uno fechado, sin año.<br>El más nuevo dice: <b style=\"color:#e2b86a\">17</b>, con una aceituna dibujada al lado.", "外面是傍晚。<br>他坐在畫室裡，沒有回頭。<br>桌上攤著你畫的那張，旁邊多了一行字。<br><br><span style=\"color:#e2b86a\">「你想要什麼。」</span>": "Afuera, atardece.<br>Él está sentado en el taller y no se da vuelta.<br>Tu dibujo está sobre la mesa, con una línea escrita al lado.<br><br><span style=\"color:#e2b86a\">«¿Qué es lo que quieres?»</span>", "外面是傍晚。<br>他坐在畫室裡，沒有回頭。<br>桌上攤著你畫的那張，旁邊多了一行字，和一截燒完的蠟燭。<br>他把它帶上來了。<br><br><span style=\"color:#e2b86a\">「你想要什麼。」</span>": "Afuera, atardece.<br>Él está sentado en el taller y no se da vuelta.<br>Tu dibujo está sobre la mesa, con una línea escrita al lado y una vela consumida.<br>La subió consigo.<br><br><span style=\"color:#e2b86a\">«¿Qué es lo que quieres?»</span>", "你坐回床邊。<br>過了很久，梯子上傳來腳步聲。<br>他停在梯子一半，看著你，又抬頭看了一眼開著的艙口。<br><br><span style=\"color:#e2b86a\">「你想要什麼。」</span><br><br>這是他第一次真的在問。": "Vuelves a sentarte en la cama.<br>Mu const img={};
function load(name){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{img[name]=i;res()};i.onerror=rej;i.src=A+name+'.png'})}
async function loadAll(){const names=['base_m','base_f','hl_m','hl_f','hair1','hair2','hair3','hair4'];
  for(const g of ['m','f'])for(const p of ['round','goat','slit'])names.push(`iris_${g}_${p}`);await Promise.all(names.map(load))}
const tmp=document.createElement('canvas');tmp.width=tmp.height=640;const tctx=tmp.getContext('2d');
function tinted(layer,color){tctx.globalCompositeOperation='source-over';tctx.clearRect(0,0,640,640);tctx.drawImage(layer,0,0,640,640);
  tctx.globalCompositeOperation='multiply';tctx.fillStyle=color;tctx.fillRect(0,0,640,640);
  tctx.globalCompositeOperation='destination-in';tctx.drawImage(layer,0,0,640,640);tctx.globalCompositeOperation='source-over';return tmp}
function drawPerson(ctx,s,size){ctx.clearRect(0,0,size,size);ctx.drawImage(img['base_'+s.eye],0,0,size,size);
  ctx.drawImage(tinted(img[`iris_${s.eye}_${s.pupil}`],s.eyeColor),0,0,size,size);ctx.drawImage(img['hl_'+s.eye],0,0,size,size);
  ctx.drawImage(tinted(img[s.hair],s.hairColor),0,0,size,size)}
const pctx=document.getElementById('portrait').getContext('2d');
function render(){drawPerson(pctx,state,640);
  document.querySelectorAll('#optHair canvas').forEach(c=>{const x=c.getContext('2d');const big=document.createElement('canvas');big.width=big.height=640;
    drawPerson(big.getContext('2d'),{...state,hair:c.dataset.hair},640);x.clearRect(0,0,c.width,c.height);x.drawImage(big,150,30,340,340,0,0,c.width,c.height)})}
function mark(el,v){el.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('sel',b.dataset.v===v));const cp=el.querySelector('.colorpick');if(cp&&v!==null)cp.style.outline=''}
function buildOpts(el,list,key){el.innerHTML='';list.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.label;b.dataset.v=o.id;
  b.onclick=()=>{state[key]=o.id;mark(el,o.id);render()};el.appendChild(b)});mark(el,state[key])}
function buildHair(el){el.innerHTML='';HAIRS.forEach(o=>{const b=document.createElement('button');b.className='opt';b.dataset.v=o.id;b.title=o.label;
  const c=document.createElement('canvas');c.width=c.height=112;c.dataset.hair=o.id;b.appendChild(c);b.onclick=()=>{state.hair=o.id;mark(el,o.id);render()};el.appendChild(b)});mark(el,state.hair)}
function buildColors(el,list,key){el.innerHTML='';list.forEach(col=>{const b=document.createElement('button');b.className='sw';b.style.background=col;b.dataset.v=col;
  b.onclick=()=>{state[key]=col;mark(el,col);render()};el.appendChild(b)});
  const p=document.createElement('label');p.className='colorpick';p.title=t('自訂顏色');const inp=document.createElement('input');inp.type='color';inp.value=state[key];
  inp.oninput=()=>{state[key]=inp.value;mark(el,null);p.style.outline='2px solid var(--ink)';render()};p.appendChild(inp);el.appendChild(p);mark(el,state[key])}
function show(id){document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('show');setTimeout(()=>{if(!s.classList.contains('show'))s.classList.remove('on')},800)});
  const el=document.getElementById(id);el.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')))}
function sketchPath(s){const h=HAIRS.find(x=>x.id===s.hair).file;return `assets/sketches/${s.eye}_${h}_${s.pupil}.jpg`}

 ['GIRASOLE','向日葵'],['PORCHETTA','烤乳豬'],['CINGHIALE','野豬'],['STRANGOZZI','手擀麵'],['TORCOLO','環形蛋糕'],['ROSMARINO','迷迭香'],
 ['ALLORO','月桂'],['VENDEMMIA','葡萄收成'],['FRANTOIO','榨油坊'],['TEVERE','台伯河'],['TRASIMENO','特拉西梅諾湖'],['SUBASIO','蘇巴修山'],
 ['MARMORE','馬莫雷瀑布'],['ASSISI','阿西西'],['PERUGIA','佩魯賈'],['GUBBIO','古比奧'],['ORVIETO','奧維多'],['SPOLETO','斯波萊托'],
 ['TODI','托迪'],['NORCIA','諾爾恰'],['DERUTA','德魯塔'],['MONTEFALCO','蒙特法爾科'],['CASTELLUCCIO','卡斯特盧喬'],['CERI','蠟燭塔'],
 ['TRAMONTO','夕陽'],['CAMPANILE','鐘樓']];
const SALT='pan-1117';
function hashName(name){const t=SALT+'|'+name.normalize('NFKC').trim().toLowerCase();let h=2166136261>>>0;
  for(const ch of t){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}
  h^=h>>>13;h=Math.imul(h,1274126177)>>>0;h^=h>>>16;return h>>>0}
function passCode(name){const h=hashName(name);const a=h%32,b=(h>>>5)%32,n=10+((h>>>10)%90);
  const w1=CODE_WORDS[a],w2=CODE_WORDS[b===a?(b+7)%32:b];return {text:`${w1[0]}-${w2[0]}-${n}`,gloss:`${w1[1]}・${w2[1]}・${n}`}}
const REQUIRED=['portrait','birthday'];// 再加上任一結局
function qualified(){return REQUIRED.every(k=>ach[k])&&(ach.leave||ach.stay)}

const ach=store.get('pan_ach',{});

const SVG={
 candle:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g stroke="#2a1a10" stroke-width="5" stroke-linejoin="round"><ellipse cx="50" cy="86" rx="30" ry="8" fill="#8a5a32"/><rect x="36" y="34" width="28" height="50" rx="4" fill="#efe1c0"/><path d="M36 40 q14 8 28 0" fill="none"/><path d="M50 34 v-12" fill="none"/></g></svg>',
 lit:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g stroke="#2a1a10" stroke-width="5" stroke-linejoin="round"><ellipse cx="50" cy="86" rx="30" ry="8" fill="#8a5a32"/><rect x="36" y="40" width="28" height="44" rx="4" fill="#efe1c0"/><path d="M36 46 q14 8 28 0" fill="none"/><path d="M50 40 v-8" fill="none"/><path d="M50 6 C62 20 60 32 50 34 C40 32 38 20 50 6Z" fill="#f3a63b"/></g><path d="M50 18 C55 25 54 30 50 31 C46 30 45 25 50 18Z" fill="#fff2b0"/></svg>'

function itemEl(id){const it=ITEMS[id];const i=new Image();
  i.src=it.icon.startsWith('svg:')?'data:image/svg+xml,'+encodeURIComponent(SVG[it.icon.slice(4)]):`assets/items/${it.icon}.png`;
  if(it.filter)i.style.filter=it.filter;i.alt=it.name;return i}

function renderInv(){const inv=document.getElementById('inv');inv.innerHTML='';
  for(let i=0;i<6;i++){const s=document.createElement('button');s.className='slot';const id=G.inv[i];
    if(id){s.appendChild(itemEl(id));if(G.sel===id)s.classList.add('sel');s.onclick=()=>clickItem(id)}
    inv.appendChild(s)}}
function give(id){if(!G.inv.includes(id))G.inv.push(id);renderInv();progress()}
function take(id){G.inv=G.inv.filter(x=>x!==id);if(G.sel===id)G.sel=null;renderInv()}
function swap(a,b){const i=G.inv.indexOf(a);if(i>-1)G.inv[i]=b;else G.inv.push(b);if(G.sel===a)G.sel=null;renderInv();progress()}
// 物品從熱點掉進物品欄的小動畫
function dropItem(id,hotId){const src=document.querySelector(`.hot[data-id="${hotId}"]`);G.busy=true;
  if(!src){give(id);G.busy=false;return}
  const r=src.getBoundingClientRect(),el=itemEl(id);
  Object.assign(el.style,{position:'fixed',left:(r.left+r.width/2-28)+'px',top:(r.top+r.height/2-28)+'px',width:'56px',height:'56px',zIndex:40,transition:'transform .45s cubic-bezier(.5,0,1,.6)',pointerEvents:'none'});
  document.body.appendChild(el);
  requestAnimationFrame(()=>{el.style.transform=`translateY(${Math.min(140,window.innerHeight-r.bottom)}px) rotate(25deg)`});
  setTimeout(()=>{const slots=document.querySelectorAll('#inv .slot');const t=slots[Math.min(G.inv.length,5)].getBoundingClientRect();
    el.style.transition='all .5s ease-in-out';el.style.left=(t.left+t.width/2-28)+'px';el.style.top=(t.top+t.height/2-28)+'px';el.style.transform='rotate(0)'},520);
  setTimeout(()=>{el.remove();G.busy=false;give(id)},1080)}

function clickItem(id){if(G.busy)return;
  if(G.sel===id){openItem(id);return}
  if(G.sel){combine(G.sel,id);return}
  G.sel=id;renderInv();say(t('拿著：')+ITEMS[id].name+'<br><small style="opacity:.6">'+t('再點一次放大看，點別的物品試著組合，點場景試著使用')+'</small>')}
function combine(a,b){const pair=[a,b].sort().join('+');
  if(pair==='brush+paper'){take('brush');take('paper');give('drawing');say(t('你攤開紙。筆毛上的赭色化開了，剛好夠畫一個人。<br>你畫了他。'));return}
  if(pair==='paper+stiffbrush'){G.sel=null;renderInv();say(t('筆毛硬得像木頭，在紙上刮出一道白痕，畫不出顏色。'));return}
  if(pair==='brush+wetpaper'||pair==='stiffbrush+wetpaper'){G.sel=null;renderInv();say(t('紙太濕了，顏料一碰就暈開。'));return}
  if(pair==='candle+drawing'||pair==='drawing+litcandle'){G.sel=null;renderInv();say(t('蠟燭插不在紙上。<br>它需要一個更好的地方。'));return}
  G.sel=b;renderInv();say(t('這兩樣湊不到一起。'))}
function openItem(id){const card=document.getElementById('card');const icon=itemEl(id);icon.style.maxHeight='220px';icon.style.width='auto';
  card.innerHTML='';card.appendChild(icon);
  card.insertAdjacentHTML('beforeend',`<div class="note">${ITEMS[id].name}</div><div class="sub">${ITEMS[id].desc}</div><div class="row"><button class="act" onclick="closeModal()">${t('放下')}</button></div>`);
  document.getElementById('modal').classList.add('on')}

let lastHot=null,hotCount=0;
function progress(){lastHot=null;hotCount=0}
function act(id){if(G.busy)return;const s=G.sel,f=G.flags;
  const before=JSON.stringify([G.inv,f]);
  hotCount=(lastHot===id)?hotCount+1:1;lastHot=id;
  switch(id){
  case 'drawer':
    if(f.drawer){say(t('抽屜空了，只剩一股乾燥的木頭味。'));break}
    openLock();break;
  case 'basket':
    if(!f.basket){f.basket=1;give('wetpaper');say(t('籃子裡捲著幾張畫紙。你抽了一張，摸起來冰冰的。<br>地窖太潮了。'))}
    else say(t('剩下的紙都受潮黏在一起了。'));break;
  case 'flowers':say(t('乾燥的洋甘菊，花瓣一碰就碎。<br>綁花的繩子上打了一個很工整的結。'));break;
  case 'bed':say(f.bed?t('床鋪得很整齊，像沒人睡過。'):t('你醒來的地方。<br>毯子是新的，摺得比你自己摺得還好。'));f.bed=1;break;
  case 'nbooks':say(t('床頭的書都是你會挑的那種。<br>你沒告訴過任何人你喜歡讀什麼。'));break;
  case 'grille':
    if(s==='key'){f.triedGrille=1;say(t('鑰匙插不進去。這道鎖比鑰匙老得多。<br>柵欄後面的黑暗裡，好像還有房間。'));checkFutile()}
    else say(t('鐵柵欄後面一片黑。<br>你把手伸進去，摸不到牆。'));break;
  case 'lamp':
    if(s==='wetpaper'){swap('wetpaper','paper');say(t('你把紙舉到油燈上方。<br>水氣一點一點散掉，紙邊捲了起來。'))}
    else if(s==='stiffbrush'){say(t('燈裡的油太燙了，筆毛一碰就會燒焦。<br>你聞到另一股油味，從南牆的桌上傳過來。'))}
    else if(s==='candle'){swap('candle','litcandle');say(t('燭芯碰到火苗，「嗤」的一聲，點著了。'))}
    else say(t('油燈不能熄。<br>你試過了，火苗連晃都沒晃。燈罩燙得不能碰。'));break;
  case 'rack':say(t('酒瓶上積著灰，標籤是手寫的義大利文，年份那欄都空著。<br>只有一瓶擦得特別乾淨，標籤上寫著：<b style="color:#e2b86a">XI</b>'));break;
  case 'door':
    if(s==='key'){f.triedDoor=1;say(t('鑰匙在這個鎖孔裡顯得太小了。<br>門很厚，聽不見外面任何聲音。'));checkFutile()}
    else say(t('門推不動。<br>鎖孔在你這一側，鑰匙不在。'));break;
  case 'trunk':
    if(f.trunk){say(t('皮箱裡空了，只剩一股松節油的味道。'));break}
    if(s==='key'){f.trunk=1;G.sel=null;give('stiffbrush');say(t('鑰匙轉得很順，像常常有人開。<br>皮箱裡放著一支畫筆，筆毛乾成一束。<br>畫家的筆乾掉了，要泡油才救得回來。'))}
    else say(t('皮箱上了鎖。鎖孔很小。'));break;
  case 'brushjar':say(t('罐子裡的畫筆都洗乾淨了，筆毛綁著，不給拿。<br>筆毛軟軟的，帶著油光。'));break;
  case 'jug':
    if(s==='stiffbrush'){swap('stiffbrush','brush');say(t('你把筆浸進陶罐。<br>是亞麻仁油。乾掉的赭色慢慢化開，跟他身上的味道一樣。'))}
    else say(t('陶罐沉甸甸的，罐口有油漬。<br>聞起來是亞麻仁油。'));break;
  case 'shelf':say(t('醃漬罐排得很整齊，每一罐都寫了日期，沒有年份。<br>最新的那罐寫著：<b style="color:#e2b86a">17</b>，旁邊畫了一顆小小的橄欖。'));break;
  case 'box':
    if(f.box){say(t('架上的木盒空了。'));break}
    f.box=1;say(t('你踮腳去搆架上的小木盒。<br>盒子歪了一下，有東西掉了出來。'));dropItem('candle','box');break;
  case 'dish':
    if(f.birthday){say(t('蠟燭還在燒。<br>火苗很小，但一直沒有熄。'));break}
    if(s==='litcandle'){f.birthday=1;take('litcandle');unlock('birthday');say(t('你把蠟燭立在菜旁邊。<br>沒有人唱歌。地窖很安靜，只有火苗的聲音。'))}
    else if(s==='candle'){say(t('蠟燭還沒點。<br>這裡唯一的火，在油燈裡。'))}
    else say(f.drawer?t('蓋子掀開，是一道你沒吃過的菜，還冒著熱氣。<br>今天比平常多了一道。'):t('蓋子掀開，是一道你沒吃過的菜，還冒著熱氣。'));break;
  case 'table':
    if(f.gift){say(t('石桌上空空的。你放的畫已經不在了。'));break}
    if(s==='drawing'){f.gift=1;take('drawing');giftScene()}
    else say(t('他每次下來，都把東西放在這張桌上。<br>書、一塊布、一碗還溫著的菜。'));break;
  case 'chair':say(t('只有一張椅子。<br>他下來的時候都站著。'));break;
  case 'canvas':flipCanvas();break;
  case 'hatch':if(f.open)openHatch();else say(t('門栓在外面。<br>從這一側，連把手都沒有。'));break;
  }
  if(JSON.stringify([G.inv,f])!==before){progress();return}
  if(hotCount>=3&&HINTS[id]){const h=HINTS[id]();if(h){say(`<span class="pan">${h}</span>`);hotCount=0}}
}

function openLock(){const card=document.getElementById('card');
  card.innerHTML=`<div class="note" style="margin-top:0">${t('抽屜上了一個黃銅轉盤鎖')}</div><div class="sub">${t('四個轉輪，數字磨得有點看不清。')}</div>

function spin(i,d){lockDigits[i]=(lockDigits[i]+d+10)%10;document.getElementById('dg'+i).textContent=lockDigits[i]}
function tryLock(){if(lockDigits.join('')===CODE){closeModal();G.flags.drawer=1;clack(false);sfxText(t('喀'));say(t('轉輪「喀」一聲對齊了。<br>一千一百一十七。抽屜裡只有一把生鏽的小鑰匙。'));dropItem('key','drawer')}
  else{document.getElementById('lockMsg').textContent=t('抽屜紋風不動。');

/* 音效：程式合成的金屬喀擦聲，不需音檔 */
let actx=null;
function clack(double=true){if(typeof muted!=='undefined'&&muted)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    const hit=(t,freq,gain,dur)=>{const n=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
      const src=actx.createBufferSource();src.buffer=buf;const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=6;
      const g=actx.createGain();g.gain.value=gain;src.connect(bp).connect(g).connect(actx.destination);src.start(actx.currentTime+t)};
    hit(0,2600,1.4,.05);hit(0,900,.9,.08);
    if(double){hit(.11,1800,1.1,.07);hit(.11,500,1,.12)}
  }catch(e){}}
function sfxText(t){const v=document.getElementById('view');const el=document.createElement('div');el.className='sfx';el.textContent=t;v.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('go'));setTimeout(()=>el.remove(),1700)}

function giftScene(){G.busy=true;const dim=document.getElementById('dim');say(t('你把畫放在桌上，畫面朝上。'));
  const steps=[[1600,()=>{dim.classList.add('on');fadeTo(0.15,2500);say(t('你等著。'))}],[3600,()=>say(G.flags.birthday?t('油燈的油少了一截。蠟燭燒短了一半。'):t('油燈的油少了一截。'))],
    [5800,()=>say(t('頭頂傳來腳步聲，停在艙口上方很久。'))],[8200,()=>{clack(true);sfxText(t('/喀噠\\'));say(t('頭頂傳來門栓滑開的聲音。'))}],
    [10400,()=>{dim.classList.remove('on');G.flags.open=1;G.busy=false;fadeTo(BGM_VOL,3000);say(t('他沒有下來。'))}]];
  steps.forEach(([t,fn])=>setTimeout(fn,t))}

function ending(type){closeModal();unlock(type);playEnding(type);
  const bd=G.flags.birthday;
  const T={leave:[t('走出去'),bd?t('外面是傍晚。<br>他坐在畫室裡，沒有回頭。<br>桌上攤著你畫的那張，旁邊多了一行字，和一截燒完的蠟燭。<br>他把它帶上來了。<br><br><span style="color:#e2b86a">「你想要什麼。」</span>'):t('外面是傍晚。<br>他坐在畫室裡，沒有回頭。<br>桌上攤著你畫的那張，旁邊多了一行字。<br><br><span style="color:#e2b86a">「你想要什麼。」</span>')],
           stay:[t('留下來'),t('你坐回床邊。<br>過了很久，梯子上傳來腳步聲。<br>他停在梯子一半，看著你，又抬頭看了一眼開著的艙口。<br><br><span style="color:#e2b86a">「你想要什麼。」</span><br><br>這是他第一次真的在問。')+(bd?t('<br><br>他的目光停在石桌上那截蠟燭。<br>他沒有說今天是什麼日子。<br>他不知道你知道。'):'')]};
  const ei=document.getElementById('endImg');ei.classList.remove('on');ei.onload=()=>ei.classList.add('on');ei.src=`assets/endings/${type}.jpg`;
  document.getElementById('endTitle').textContent=T[type][0];
  document.getElementById('endText').innerHTML=T[type][1];
  document.getElementById('achList').innerHTML=Object.entries(ACH).map(([k,v])=>`<li class="${ach[k]?'':'no'}">${ach[k]?'◆':'◇'} ${v.name}　<small>${ach[k]?v.desc:'？？？'}</small></li>`).join('');
  const box=document.getElementById('codeBox');
  if(qualified()){const c=passCode(state.name);
    box.innerHTML=`<div style="border:1px solid #5c4630;padding:14px 18px;max-width:420px;margin:auto;background:#1e1711"><div style="font-size:12px;letter-spacing:.3em;opacity:.7">${t('{name} 的通關碼').replace('{name}',state.name)}</div><div style="font-size:20px;letter-spacing:.12em;color:#e2b86a;margin:8px 0;font-family:monospace;word-break:break-all">${c.text}</div>${LANG==='zh'?`<div style="font-size:13px;opacity:.75">${c.gloss}</div>`:''}<div style="font-size:12px;opacity:.6;margin-top:10px;line-height:1.7">${t('截圖或抄下這組碼，連同你在登記簿上簽的名字一起回報。<br>名字要一字不差，碼才對得上。')}</div></div>`}
  else{const miss=REQUIRED.filter(k=>!ach[k]).length;box.innerHTML=`<div style="font-size:13px;opacity:.6">${t('還有 {n} 個成就沒找到。全部找齊，結局會出現通關碼。').replace('{n}',miss)}</div>`}
  document.getElementById('nightBtn').style.display=G.flags.birthday?'':'none';
  show('ending')}
document.getElementById('againBtn').onclick=()=>startGame();
document.getElementById('nightBtn').onclick=()=>{const card=document.getElementById('card');
  card.innerHTML=`<img src="assets/endings/birthday.jpg" alt=""><div class="note">${t('那天晚上，他沒有吹熄它。')}</div><div class="sub">${t('他不知道蠟燭是要許願的。<br>他只是守著，直到它自己燒完。')}</div><div class="row"><button class="act" onclick="closeModal()">${t('闔上')}</button></div>`;
  document.getElementById('modal').classList.add('on')};

function startGame(){if(typeof endbgm!=='undefined'&&!endbgm.paused)stopEnding();fadeTo(BGM_VOL,2000);newGame();renderInv();go('north');show('game');say(state.name+t('。')+'<br>'+t('醒來的時候，你在地窖裡。'))}


/* ============ 音樂 ============ */
const bgm=document.getElementById('bgm'),muteBtn=document.getElementById('muteBtn');
const BGM_VOL=0.55;let muted=store.get('pan_muted',false);
function fadeTo(v,ms=1500){clearInterval(fadeTo.t);const start=bgm.volume,t0=performance.now();
  fadeTo.t=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);bgm.volume=start+(v-start)*k;if(k>=1)clearInterval(fadeTo.t)},40)}
function bgmStart(){muteBtn.classList.add('on');syncMute();if(muted)return;bgm.volume=0;bgm.play().then(()=>fadeTo(BGM_VOL,2500)).catch(()=>{})}
const endbgm=document.getElementById('endbgm');
function syncMute(){muteBtn.classList.toggle('off',muted);bgm.muted=muted;endbgm.muted=muted}
function playEnding(type){endbgm.src=`assets/audio/ending_${type}.mp3`;fadeTo(0,1800);setTimeout(()=>{bgm.pause()},1900);endbgm.currentTime=0;endbgm.volume=0.75;setTimeout(()=>{endbgm.play().catch(()=>{})},1200)}
function stopEnding(){endbgm.pause();endbgm.currentTime=0;if(!muted){bgm.volume=0;bgm.play().catch(()=>{})}}
muteBtn.onclick=()=>{muted=!muted;store.set('pan_muted',muted);syncMute();if(!muted&&bgm.paused){bgm.volume=0;bgm.play().then(()=>fadeTo(BGM_VOL)).catch(()=>{})}};

/* ============ 啟動 ============ */
document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=t(el.dataset.t));
document.querySelectorAll('[data-tp]').forEach(el=>el.placeholder=t(el.dataset.tp));
document.getElementById('langs').innerHTML=LANGS.map(([k,n])=>`<a href="?lang=${k}" style="color:${k===LANG?'#e2b86a':'#8a7558'};font-size:13px;text-decoration:none;padding:4px 8px;border:1px solid ${k===LANG?'#8a6a3a':'transparent'}">${n}</a>`).join('');

const nameInput=document.getElementById('nameInput'),confirmBtn=document.getElementById('confirmBtn'),hint=document.getElementById('hint');
nameInput.oninput=()=>{state.name=nameInput.value.trim();confirmBtn.disabled=!state.name;hint.textContent=''};
confirmBtn.onclick=()=>{if(!state.name){hint.textContent=t('登記簿上不能沒有名字。');return}
  store.set('pan_player',state);bgmStart();confirmBtn.disabled=true;nameInput.disabled=true;document.querySelector('.stamp').classList.add('on');
  setTimeout(startGame,1300)};
document.getElementById('startBtn').onclick=()=>show('creator');
window.PAN={state,G:()=>G,go,act};

(async()=>{show('intro');
  try{await loadAll();buildOpts(document.getElementById('optEye'),EYES,'eye');buildOpts(document.getElementById('optPupil'),PUPILS,'pupil');
    buildColors(document.getElementById('optEyeColor'),EYE_COLORS,'eyeColor');buildHair(document.getElementById('optHair'));
    buildColors(document.getElementById('optHairColor'),HAIR_COLORS,'hairColor');render()}
  catch(e){document.querySelector('#intro p').textContent=t('素材載入失敗，請重新整理。')}})();
</script>
</body>
