<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通關碼驗證</title>
<style>body{background:#14100c;color:#d9c8a8;font-family:'Noto Serif TC',serif;display:flex;justify-content:center;padding:40px 16px}
.c{max-width:460px;width:100%}h1{font-size:18px;letter-spacing:.3em;color:#e2b86a}label{display:block;margin-top:16px;font-size:13px;opacity:.8}
input,textarea{width:100%;background:#1e1711;border:1px solid #5c4630;color:#e8d8b8;padding:10px;font-size:16px;font-family:inherit;margin-top:6px}
button{margin-top:16px;background:#8b3a1a;color:#e9dcc2;border:none;padding:10px 24px;font-size:15px;letter-spacing:.2em;cursor:pointer}
#r{margin-top:18px;font-size:16px;line-height:1.8;white-space:pre-wrap}.ok{color:#9fd18b}.ng{color:#e07a6a}</style></head><body><div class="c">
<h1>通關碼驗證</h1>
<label>一行一筆：名字,通關碼</label><textarea id="list" rows="8" placeholder="安谷,OLIVO-TARTUFO-27"></textarea>
<button id="go">驗證</button><div id="r"></div></div>
<script>

/* ============ 通關碼 ============ */
// 字庫：翁布里亞的東西。改字庫或 SALT 會讓舊碼全部失效，活動開始後不要動。
const CODE_WORDS=[
 ['OLIVO','橄欖樹'],['TARTUFO','松露'],['LENTICCHIA','扁豆'],['SAGRANTINO','薩格蘭蒂諾酒'],['MAIOLICA','彩陶'],['CIPRESSO','柏樹'],
 ['GIRASOLE','向日葵'],['PORCHETTA','烤乳豬'],['CINGHIALE','野豬'],['STRANGOZZI','手擀麵'],['TORCOLO','環形蛋糕'],['ROSMARINO','迷迭香'],
 ['ALLORO','月桂'],['VENDEMMIA','葡萄收成'],['FRANTOIO','榨油坊'],['TEVERE','台伯河'],['TRASIMENO','特拉西梅諾湖'],['SUBASIO','蘇巴修山'],
 ['MARMORE','馬莫雷瀑布'],['ASSISI','阿西西'],['PERUGIA','佩魯賈'],['GUBBIO','古比奧'],['ORVIETO','奧維多'],['SPOLETO','斯波萊托'],
 ['TODI','托迪'],['NORCIA','諾爾恰'],['DERUTA','德魯塔'],['MONTEFALCO','蒙特法爾科'],['CASTELLUCCIO','卡斯特盧喬'],['CERI','蠟燭塔'],
 ['TRAMONTO','夕陽'],['CAMPANILE','鐘樓']];
const SALT='pan-1117';
function hashName(name){const t=SALT+'|'+name.normalize('NFKC').trim().toLowerCase();let h=2166136261>>>0;
  for(const ch of t){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}
  h^=h>>>13;h=Math.imul(h,1274126177)>>>0;h^=h>>>16;return h>>>0}
function passCode(name){const h=hashName(name);const a=h%32,b=(h>>>5)%32,n=10+((h>>>10)%90);
  const w1=CODE_WORDS[a],w2=CODE_WORDS[b===a?(b+7)%32:b];return {text:`${w1[0]}-${w2[0]}-${n}`,gloss:`${w1[1]}・${w2[1]}・${n}`}}

document.getElementById('go').onclick=()=>{const out=[];
 document.getElementById('list').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
  const i=l.lastIndexOf(',')>-1?l.lastIndexOf(','):l.lastIndexOf('，');if(i<0){out.push(`<span class="ng">✗ 格式錯誤：${l}</span>`);return}
  const name=l.slice(0,i).trim(),code=l.slice(i+1).trim().toUpperCase().replace(/[\s·・]/g,'-').replace(/-+/g,'-');
  const ok=passCode(name).text===code;out.push(`<span class="${ok?'ok':'ng'}">${ok?'✓':'✗'} ${name}　${code}${ok?'':'　（應為 '+passCode(name).text+'）'}</span>`)});
 document.getElementById('r').innerHTML=out.join('\n')};
</script></body></html>
